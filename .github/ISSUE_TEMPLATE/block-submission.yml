name: Block submission
description: Results from searching a block on the Contribute page. The page fills this in for you.
title: "Block submission: #"
labels: ["block-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for lending your CPU! Press **Create** and an automated check will re-run these blocks, usually within a few minutes. New knots it confirms are added to the archive with your GitHub name.
  - type: input
    id: block
    attributes:
      label: Blocks
      description: The block numbers shown on the Contribute page.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Filled in by the Contribute page. Please don't edit it.
      render: json
    validations:
      required: true
